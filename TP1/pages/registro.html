<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Instrumentos Musicales| Mi cuenta</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="../styles/styles.css">
    </head>
    <body>
        <div class="container">
            <header class="header"> 
                <div class="icon">
                    <a href="../index.html"> <img src="../images/pick.png" alt="logo"></a> 
                    <h1>Instrumentos&nbsp;&nbsp;&nbsp;Musicales&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;Mi&nbsp;&nbsp;&nbsp;cuenta</h1>
                </div>
                <div id="navbar"></div>
            </header>
            <main>
                <h2>Mi cuenta</h2>
                <section> 
                    <h3>Iniciá sesión o registrate</h3>
                    <form action="" method="post">
                        <label for="name">Nombre:</label>
                        <input type="text" id="name" name="name" required>
                        <br>
                        <label for="apellido">Apellido:</label>
                        <input type="text" id="apellido" name="apellido" required>
                        <br>
                        <label for="email">Correo electrónico:</label>
                        <input type="email" id="email" name="email" required>
                        <br>
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" required>
                        <br>
                        <label for="fecha_nacimiento">Fecha de nacimiento:</label>
                        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
                        <br>
                        <br>
                        <input type="submit" id="ingresar" value="Ingresar">
                        <br>
                    </form> 
                </section>
            </main>
            <footer>
                <div class="footer">
                    <div class="bi">
                        <a href="#"> <i class="bi bi-instagram"></i></a> 
                        <a href="mailto:contacto@intrumentosmusicales.com"> <i class="bi bi-envelope"></i></a>
                    </div>
                    <p class="copy"> <i class="bi bi-c-circle"></i> 2026. Instrumentos Musicales. Todos los derechos reservados.</p>
                </div>
            </footer>
        </div>
        <script src="../js/login.js"></script>
        <script src="../js/logout.js"></script>
        <script src="../js/navbar.js"></script>
    </body>
</html>
