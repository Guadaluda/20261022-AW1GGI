<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Instrumentos Musicales| Registro</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="../styles/styles.css">
        <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    </head>
    <body>
        <div class="container">
            <header class="header"> 
                <div class="icon">
                    <a href="../index.html"> <img src="../images/logomusic1-1.jpg" alt="logo"></a> 
                    <h1>Instrumentos&nbsp;Musicales<br>Registro</h1>
                </div>
                <div id="navbar"></div>
            </header>
            <main class="pages">
                <h2>Registro</h2>
                <section class="registro"> 
                    <h3>Completá tus datos</h3>
                    <form class="form-register" action="" method="post">
                        <label for="name">Nombre:</label>
                        <input type="text" id="name" name="name" required>
                        <br>
                        <label for="apellido">Apellido:</label>
                        <input type="text" id="apellido" name="apellido" required>
                        <br>
                        <label for="email">Correo electrónico:</label>
                        <input type="email" id="email" name="email" required>
                        <br>
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" required>
                        <br>
                        <label for="fechaNacimiento">Fecha de nacimiento:</label>
                        <input type="date" id="fecha-nacimiento" name="fecha-nacimiento" required>
                        <br>
                        <input type="submit" id="register" value="Ingresar">
                        
                        <br>
                    </form> 
                </section>
            </main>
            <footer>
                <div class="footer">
                    <div class="bi">
                        <a href="#"> <i class="bi bi-instagram"></i></a> 
                        <a href="mailto:contacto@intrumentosmusicales.com"> <i class="bi bi-envelope"></i></a>
                    </div>
                    <p class="copy"><i class="bi bi-c-circle"></i> 2026.<br>Instrumentos Musicales.<br>Todos los derechos reservados.</p>
                </div>
            </footer>
        </div>
        <script src="../js/register.js"></script>
        <script src="../js/logout.js"></script>
        <script src="../js/navbar.js"></script>
        <script src="../js/products.js"></script>
        <script src="../js/search.js"></script>
        <script src="../js/cart.js"></script>
    </body>
